<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>LiquidityPlus · TradingView</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#080a0d;--panel:#0f1318;--line:#242b33;--gold:#f5b928;--text:#f7f8fa;--muted:#8c96a3;--green:#16c784;--red:#ea3943;--blue:#4285f4;--purple:#a855f7}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    .app{height:100%;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(8,10,13,.96)}
    .logo{width:34px;height:34px;border:1px solid #654a0f;border-radius:9px;display:grid;place-items:center;color:var(--gold);font-weight:900}.title{min-width:0;flex:1}.title b{display:block;font-size:14px;letter-spacing:.4px}.title span{font-size:12px;color:var(--muted)}
    .badge{font-size:12px;font-weight:800;padding:6px 9px;border:1px solid var(--line);border-radius:8px;white-space:nowrap}.chart-wrap{position:relative;flex:1;min-height:0}.chart{position:absolute;inset:0;z-index:1}.zones{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}.zone{position:absolute;border:1.5px solid;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);min-height:5px;overflow:hidden}.zone-label{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:900;letter-spacing:.25px;text-shadow:0 1px 2px #000;background:rgba(8,10,13,.72);padding:2px 5px;border-radius:4px;white-space:nowrap}.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;background:#111820;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);z-index:5;max-width:85%;text-align:center}.bottom{height:42px;padding:0 12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#090c10;font-size:11px;color:var(--muted)}
    .bottom a{color:var(--gold);text-decoration:none}.open-tv{color:var(--text)!important;border:1px solid #4a3610;background:#171208;border-radius:7px;padding:6px 9px;font-weight:700}.hidden{display:none}
    @media(max-width:520px){.top{height:54px;padding:0 10px}.badge{font-size:11px;padding:5px 7px}.bottom{font-size:10px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">LP</div>
    <div class="title"><b id="pair">BTC / USDT</b><span id="subtitle">LiquidityPlus signal</span></div>
    <div class="badge" id="direction">—</div>
  </div>
  <div class="chart-wrap">
    <div id="chart" class="chart"></div>
    <div id="zones" class="zones"></div>
    <div id="status" class="status">Загрузка графика…</div>
  </div>
  <div class="bottom">
    <span>LiquidityPlus · автоматическая разметка сигнала</span><span id="zoneInfo">FVG · OB · LIQ</span>
  </div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const symbol = (q.get('symbol') || 'BTC').toUpperCase();
  const inst = (q.get('inst') || `${symbol}-USDT-SWAP`).toUpperCase();
  const dir = (q.get('dir') || '').toUpperCase();
  const sid = q.get('sid') || '';
  const $ = id => document.getElementById(id);
  $('pair').textContent = `${symbol} / USDT`;
  $('subtitle').textContent = sid ? `LiquidityPlus · LP-${sid}` : 'LiquidityPlus signal';
  $('direction').textContent = dir || 'SIGNAL';
  $('direction').style.color = dir === 'SHORT' ? '#ea3943' : '#16c784';

  function nums(v){ return (String(v||'').replace(/,/g,'.').match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(n=>Number.isFinite(n) && n>0); }
  function first(v){ const a=nums(v); return a.length?a[0]:null; }
  function zone(v){ const a=nums(v); if(!a.length)return null; if(a.length===1)return [a[0],a[0]]; return [Math.min(a[0],a[1]),Math.max(a[0],a[1])]; }
  function midpoint(v){ const z=zone(v); return z?(z[0]+z[1])/2:null; }

  const levels = {
    entry: midpoint(q.get('entry')),
    sl: first(q.get('sl')),
    tp1: first(q.get('tp1')),
    tp2: first(q.get('tp2')),
    tp3: first(q.get('tp3')),
    fvg: zone(q.get('fvg')),
    ob: zone(q.get('ob')),
    entryZone: zone(q.get('entry')),
  };

  function validateLevelsAgainstMarket(lastPrice){
    if(!Number.isFinite(lastPrice) || lastPrice<=0) return;
    const sane = v => Number.isFinite(v) && v>0 && v>=lastPrice/100 && v<=lastPrice*100;
    for(const k of ['entry','sl','tp1','tp2','tp3']){ if(!sane(levels[k])) levels[k]=null; }
    for(const k of ['fvg','ob','entryZone']){
      const z=levels[k];
      if(z && (!sane(z[0]) || !sane(z[1]))) levels[k]=null;
    }
  }

  const chart = LightweightCharts.createChart($('chart'), {
    layout:{background:{color:'#080a0d'},textColor:'#a8b0bb'},
    grid:{vertLines:{color:'#171c22'},horzLines:{color:'#171c22'}},
    rightPriceScale:{borderColor:'#2a3139',scaleMargins:{top:.08,bottom:.08}},
    timeScale:{borderColor:'#2a3139',timeVisible:true,secondsVisible:false,rightOffset:8,barSpacing:7},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    localization:{priceFormatter:p=>p>=1000?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(7)},
  });
  const series = chart.addCandlestickSeries({upColor:'#16c784',downColor:'#ea3943',borderVisible:false,wickUpColor:'#16c784',wickDownColor:'#ea3943'});

  function line(price,title,color,style=0,width=1){
    if(!Number.isFinite(price)) return;
    series.createPriceLine({price,color,lineWidth:width,lineStyle:style,axisLabelVisible:true,title});
  }
  line(levels.entry,'ENTRY','#f5b928',0,2);
  line(levels.sl,'SL','#ea3943',2,2);
  line(levels.tp1,'TP1','#16c784',2,1);
  line(levels.tp2,'TP2','#16c784',2,1);
  line(levels.tp3,'TP3','#16c784',2,1);

  const zoneSpecs=[];
  if(levels.entryZone && levels.entryZone[0]!==levels.entryZone[1]) zoneSpecs.push({z:levels.entryZone,label:'ENTRY ZONE',color:'#f5b928'});
  if(levels.fvg) zoneSpecs.push({z:levels.fvg,label:'FVG',color:'#4285f4'});
  if(levels.ob) zoneSpecs.push({z:levels.ob,label:'ORDER BLOCK',color:'#a855f7'});

  function atr(c, n=14){
    if(c.length<2)return 0;
    const a=[];
    for(let i=1;i<c.length;i++) a.push(Math.max(c[i].high-c[i].low,Math.abs(c[i].high-c[i-1].close),Math.abs(c[i].low-c[i-1].close)));
    const x=a.slice(-n); return x.reduce((s,v)=>s+v,0)/(x.length||1);
  }
  function detectFvg(c){
    const recent=c.slice(-90); const last=recent[recent.length-1]?.close;
    const found=[];
    for(let i=2;i<recent.length;i++){
      const a=recent[i-2], x=recent[i];
      if(x.low>a.high) found.push({z:[a.high,x.low], side:'BULL', age:recent.length-i});
      if(x.high<a.low) found.push({z:[x.high,a.low], side:'BEAR', age:recent.length-i});
    }
    // Prefer recent zones near current price.
    found.sort((u,v)=>((Math.abs(((u.z[0]+u.z[1])/2)-last))/(last||1)+u.age*.0005)-((Math.abs(((v.z[0]+v.z[1])/2)-last))/(last||1)+v.age*.0005));
    return found[0]||null;
  }
  function detectOb(c, direction){
    const recent=c.slice(-80); if(recent.length<8)return null;
    const A=atr(recent,14)||1;
    for(let i=recent.length-4;i>=2;i--){
      const x=recent[i], n1=recent[i+1], n2=recent[i+2];
      const impulse=Math.abs(n2.close-x.close);
      if(direction==='LONG' && x.close<x.open && n1.close>n1.open && n2.close>n2.open && impulse>A*1.15) return [x.low,x.high];
      if(direction==='SHORT' && x.close>x.open && n1.close<n1.open && n2.close<n2.open && impulse>A*1.15) return [x.low,x.high];
    }
    return null;
  }

  function zoneGeometry(item, holderWidth){
    const label=(item.label||'').toUpperCase();
    // Geometry deliberately mimics TradingView-style structure boxes:
    // FVG = wide imbalance area, OB = compact candle block, liquidity = medium pool.
    if(label.includes('ORDER BLOCK')) return {left:Math.round(holderWidth*0.27), width:Math.round(holderWidth*0.22)};
    if(label.includes('FVG')) return {left:Math.round(holderWidth*0.12), width:Math.round(holderWidth*0.48)};
    if(label.includes('LIQUIDITY')) return {left:Math.round(holderWidth*0.58), width:Math.round(holderWidth*0.26)};
    if(label.includes('ENTRY ZONE')) return {left:Math.round(holderWidth*0.46), width:Math.round(holderWidth*0.30)};
    return {left:Math.round(holderWidth*0.30), width:Math.round(holderWidth*0.36)};
  }

  function drawZones(){
    const holder=$('zones'); holder.innerHTML='';
    const hw=holder.clientWidth || $('chart').clientWidth || 1000;
    const hh=holder.clientHeight || $('chart').clientHeight || 600;
    for(const item of zoneSpecs){
      const y1=series.priceToCoordinate(item.z[1]); const y2=series.priceToCoordinate(item.z[0]);
      if(y1==null||y2==null) continue;
      let top=Math.min(y1,y2), height=Math.abs(y2-y1);
      // Keep zones readable without letting tiny OB/FVG collapse into a line.
      const isOb=(item.label||'').toUpperCase().includes('ORDER BLOCK');
      const isLiq=(item.label||'').toUpperCase().includes('LIQUIDITY');
      const minH=isOb ? 18 : (isLiq ? 14 : 26);
      if(height<minH){ const mid=(y1+y2)/2; height=minH; top=mid-height/2; }
      top=Math.max(1,Math.min(top,Math.max(1,hh-height-1)));
      const g=zoneGeometry(item,hw);
      const d=document.createElement('div'); d.className='zone';
      d.style.left=`${g.left}px`; d.style.width=`${Math.max(56,g.width)}px`;
      d.style.top=`${top}px`; d.style.height=`${Math.max(5,height)}px`;
      d.style.borderColor=item.color; d.style.background=`${item.color}22`;
      d.style.boxShadow=`inset 2px 0 0 ${item.color}b8, inset 0 0 0 1px ${item.color}1f`;
      const l=document.createElement('span'); l.className='zone-label'; l.style.color=item.color; l.textContent=item.label; d.appendChild(l); holder.appendChild(d);
    }
  }

  function swingLevels(c){
    const src=c.slice(-100); if(src.length<12)return {};
    let highs=[],lows=[];
    for(let i=2;i<src.length-2;i++){
      const x=src[i];
      if(x.high>src[i-1].high&&x.high>src[i-2].high&&x.high>=src[i+1].high&&x.high>=src[i+2].high) highs.push(x.high);
      if(x.low<src[i-1].low&&x.low<src[i-2].low&&x.low<=src[i+1].low&&x.low<=src[i+2].low) lows.push(x.low);
    }
    const last=src[src.length-1].close;
    return {
      above: highs.filter(x=>x>last).sort((a,b)=>a-b)[0] || null,
      below: lows.filter(x=>x<last).sort((a,b)=>b-a)[0] || null,
    };
  }

  function addLiquidityZones(c){
    const sw=swingLevels(c); const pad=(atr(c,14)||0)*0.12;
    if(Number.isFinite(sw.above)){
      zoneSpecs.push({z:[sw.above-pad,sw.above+pad],label:'BUY-SIDE LIQUIDITY',color:'#f0a83a'});
    }
    if(Number.isFinite(sw.below)){
      zoneSpecs.push({z:[sw.below-pad,sw.below+pad],label:'SELL-SIDE LIQUIDITY',color:'#f0a83a'});
    }
  }

  function ensureStructureZones(c){
    if(!levels.fvg){ const f=detectFvg(c); if(f) zoneSpecs.push({z:f.z,label:`FVG ${f.side}`,color:'#4285f4'}); }
    if(!levels.ob){ const z=detectOb(c,dir); if(z) zoneSpecs.push({z,label:'ORDER BLOCK',color:'#a855f7'}); }
    addLiquidityZones(c);
  }

  function forcePriceRange(c){
    const vals=[levels.entry,levels.sl,levels.tp1,levels.tp2,levels.tp3];
    for(const z of zoneSpecs){ if(z?.z){vals.push(z.z[0],z.z[1]);} }
    const finite=vals.filter(Number.isFinite); if(!finite.length||!c.length)return;
    const mn=Math.min(...finite), mx=Math.max(...finite);
    const firstTime=c[Math.max(0,c.length-80)].time, lastTime=c[c.length-1].time;
    const lowSeries=chart.addLineSeries({color:'rgba(0,0,0,0)',lineVisible:false,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
    const highSeries=chart.addLineSeries({color:'rgba(0,0,0,0)',lineVisible:false,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
    lowSeries.setData([{time:firstTime,value:mn},{time:lastTime,value:mn}]);
    highSeries.setData([{time:firstTime,value:mx},{time:lastTime,value:mx}]);
  }

  async function load(){
    try{
      const url=`https://www.okx.com/api/v5/market/candles?instId=${encodeURIComponent(inst)}&bar=15m&limit=200`;
      const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(`OKX ${r.status}`);
      const j=await r.json(); if(j.code!=='0'||!Array.isArray(j.data)) throw new Error(j.msg||'Нет свечей');
      const candles=j.data.map(x=>({time:Math.floor(Number(x[0])/1000),open:Number(x[1]),high:Number(x[2]),low:Number(x[3]),close:Number(x[4])})).reverse();
      validateLevelsAgainstMarket(candles.length ? candles[candles.length-1].close : null);
      series.setData(candles);
      ensureStructureZones(candles);
      forcePriceRange(candles);
      chart.timeScale().fitContent();
      $('status').classList.add('hidden');
      $('zoneInfo').textContent = `FVG · OB · LIQ · ${zoneSpecs.length} зон`;
      requestAnimationFrame(drawZones);
      setTimeout(drawZones,80);
      setTimeout(drawZones,250);
      setTimeout(drawZones,700);
    }catch(e){
      $('status').innerHTML=`Не удалось получить свечи OKX.<br><small>${String(e.message||e)}</small>`;
    }
  }
  new ResizeObserver(()=>{chart.applyOptions({width:$('chart').clientWidth,height:$('chart').clientHeight});requestAnimationFrame(drawZones)}).observe($('chart'));
  chart.timeScale().subscribeVisibleTimeRangeChange(()=>requestAnimationFrame(drawZones));
  chart.timeScale().subscribeVisibleLogicalRangeChange(()=>requestAnimationFrame(drawZones));
  load();
})();
</script>
</body>
</html>
